name: redraw

on:
  schedule:
    - cron: '0 3 * * 1' # monday 06:00 kyiv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dvakatsiienko/frame
          path: frame
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: take the hero and the tour tiles from frame
        run: cp frame/brand/profile/out/readme/assets/hero-*.svg frame/brand/profile/out/readme/assets/tour-*.svg assets/
      - name: draw the board and the cards
        run: node frame/brand/profile/redraw.ts --fetch --data assets/fleet.json --out assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LINEAR_TOKEN: ${{ secrets.LINEAR_TOKEN }}
      - name: commit the redraw
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898276+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "🤖 redraw: $(jq -r .redrawn assets/fleet.json)"
          git push
